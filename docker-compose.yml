services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tregocon
      POSTGRES_PASSWORD: tregocon_dev
      POSTGRES_DB: tregocon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tregocon"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tregocon:tregocon_dev@postgres:5432/tregocon
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
