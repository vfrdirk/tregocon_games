# Sandbox compose for Docker-in-LXC (Proxmox).
# Uses network_mode: host because docker-proxy port publishing is unreliable
# inside an unprivileged LXC. Each service binds a distinct host port;
# Caddy (8080) proxies to backend (8000) and frontend (8081) via 127.0.0.1.
# Phase 1 (Lightsail): revert to bridge networking + Caddy TLS.

services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: tregocon
      POSTGRES_PASSWORD: tregocon_dev
      POSTGRES_DB: tregocon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tregocon"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    network_mode: host
    environment:
      DATABASE_URL: postgresql://tregocon:tregocon_dev@127.0.0.1:5432/tregocon
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    network_mode: host

  caddy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
  uploads:
