server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths (not /api, /uploads, /docs) go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + uploads + docs are proxied by Caddy, not nginx; but if hit directly:
    location /api/ { return 404; }
}
