stages:
  - build
  - deploy

variables:
  IMAGE: "$CI_REGISTRY_IMAGE/backend:latest"

build_backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t $IMAGE ./backend
    - docker push $IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_lightsail:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd /opt/tregocon && git pull origin main && docker compose -f docker-compose.prod.yml --env-file .env pull && docker compose -f docker-compose.prod.yml --env-file .env up -d"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
