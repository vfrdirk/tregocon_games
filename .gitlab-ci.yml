stages:
  - deploy

# Phase 1 (Lightsail): no container registry needed.
# The deploy job SSHes into the Lightsail box and builds/relaunches the stack
# via docker compose (which builds backend/frontend images on the box).
# Required CI variables (Settings > CI/CD > Variables, masked):
#   SSH_PRIVATE_KEY  - private key for $DEPLOY_USER@$DEPLOY_HOST
#   SSH_KNOWN_HOSTS  - `ssh-keyscan $DEPLOY_HOST`
#   DEPLOY_USER      - e.g. ubuntu
#   DEPLOY_HOST      - the Lightsail static IP / DNS (play.tregocon.games)
deploy_lightsail:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd /opt/tregocon && git pull origin main && docker compose -f docker-compose.prod.yml --env-file .env up -d --build"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
